name: "Test Features"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - act
          - uv
          - node
          - flutter
    steps:
      - uses: actions/checkout@v4
      - name: "Install devcontainer CLI"
        run: npm install -g @devcontainers/cli
      - name: "Test ${{ matrix.features }} (autorun)"
        run: devcontainer features test --features ${{ matrix.features }} --base-image mcr.microsoft.com/devcontainers/base:bookworm .

  test-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Install devcontainer CLI"
        run: npm install -g @devcontainers/cli
      - name: "Test global scenarios (act + uv together)"
        run: devcontainer features test --global-scenarios-only .
